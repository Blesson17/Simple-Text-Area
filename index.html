<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Character Counter</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(31 41 55 / 10%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 20px;
      color: #4b5563;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 160px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      outline: 3px solid rgb(37 99 235 / 20%);
      border-color: #2563eb;
    }

    .limit {
      margin: 8px 0 12px;
      font-size: 0.875rem;
    }

    .counter {
      margin-bottom: 6px;
      color: #1f2937;
      font-size: 0.9375rem;
    }

    .warning {
      min-height: 1.25em;
      margin: 0;
      color: #b91c1c;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Write a message</h1>
    <p>Type your message below and keep track of its length.</p>

    <label for="message">Your message</label>
    <textarea id="message" name="message" maxlength="200" aria-describedby="limit counter remaining warning"></textarea>
    <p class="limit" id="limit">200 characters max</p>
    <p class="counter" id="counter" aria-live="polite">0/200 characters</p>
    <p class="counter" id="remaining">200 characters remaining</p>
    <p class="warning" id="warning" role="status" aria-live="polite"></p>
  </main>

  <script>
    const maximumCharacters = 200;
    const messageInput = document.querySelector("#message");
    const counter = document.querySelector("#counter");
    const remaining = document.querySelector("#remaining");
    const warning = document.querySelector("#warning");

    function updateCounter() {
      const characterCount = messageInput.value.length;
      const charactersRemaining = maximumCharacters - characterCount;

      counter.textContent = `${characterCount}/${maximumCharacters} characters`;
      remaining.textContent = `${charactersRemaining} ${charactersRemaining === 1 ? "character" : "characters"} remaining`;
    }

    messageInput.addEventListener("beforeinput", (event) => {
      if (!event.inputType.startsWith("insert")) {
        return;
      }

      const selectionLength = messageInput.selectionEnd - messageInput.selectionStart;
      const insertedText = event.data ?? event.dataTransfer?.getData("text/plain") ?? "";

      if (messageInput.value.length - selectionLength + insertedText.length > maximumCharacters) {
        event.preventDefault();
        warning.textContent = `Maximum of ${maximumCharacters} characters reached. Further input is blocked.`;
      }
    });

    messageInput.addEventListener("paste", (event) => {
      const selectionLength = messageInput.selectionEnd - messageInput.selectionStart;
      const pastedText = event.clipboardData.getData("text/plain");

      if (messageInput.value.length - selectionLength + pastedText.length > maximumCharacters) {
        event.preventDefault();
        warning.textContent = `Maximum of ${maximumCharacters} characters reached. Further input is blocked.`;
      }
    });

    messageInput.addEventListener("input", () => {
      updateCounter();
      warning.textContent = "";

      if (messageInput.value.length === maximumCharacters) {
        warning.textContent = `Maximum of ${maximumCharacters} characters reached. Further input is blocked.`;
      }
    });

    updateCounter();
  </script>
</body>
</html>
